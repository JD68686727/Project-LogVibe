# Example stack with several hardening issues (for the config audit demo)
version: "3.8"
services:
  web:
    image: nginx:latest
    privileged: true
    network_mode: host
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  db:
    image: postgres:16
    pid: "host"
    environment:
      POSTGRES_PASSWORD: changeme
